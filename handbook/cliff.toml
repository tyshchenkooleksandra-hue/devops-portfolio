# Конфігурація git-cliff: список змін генерується з історії main.
# Локально: git cliff -o CHANGELOG.md   (або npx git-cliff -o CHANGELOG.md)
[changelog]
header = """
# Список змін

Генерується автоматично з історії `main` (Conventional Commits) — вручну не редагується.\n
"""
body = """
{% if version %}## {{ version }} — {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## Не випущено{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Нове" },
  { message = "^fix", group = "<!-- 1 -->Виправлення" },
  { message = "^docs", group = "<!-- 2 -->Документація" },
  { message = "^(ci|build)", group = "<!-- 3 -->Конвеєр і збірка" },
  { message = "^(refactor|perf|style|test|chore|revert)", group = "<!-- 4 -->Інше" },
]
filter_commits = false
sort_commits = "oldest"
